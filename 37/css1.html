	<title>Document</title>
	<style>
		table{
			border-collapse: collapse;
		}
		th, td {
			width: 150px;
		}
		th{
			border: solid 2px black;
			background: lightgreen;
			padding: 4px;
		}
		td{
			border: solid 1px grey;
			text-align: center;
			padding-top: 10px;
		}
		tr:nth-of-type(2n+1){
			background: lightgrey;
		}
		td:nth-of-type(2n+1){

		}
	</style>
</head>
