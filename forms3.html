<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<form action="">
		<fieldset>
			<legend>Academic Information</legend>
			<label for="">Student ID</label>
			<input type="text">
			<br>
			<label for="">Degree</label>
			<blockquote>
				<select name="" id="">
					<option value="">Bachelor of Art</option>
					<option value="">Bachelor of Science</option>
					<option value="">Master of Business Administration</option>
				</select>
			</blockquote>
			<br>
			<!-- <br> -->
			<!-- <br> -->
			<label for="">Classes attended</label>
			<br>
			<select name="" id="" multiple>
				<option value="">Geography</option>
				<option value="">Mathematics</option>
				<option value="">English</option>
			</select>
		</fieldset>
		<fieldset>
			<legend>Personal Details</legend>
			<label for="">First Name</label>
			<input type="text">
			<br>
			<label for="">Last Name</label>
			<input type="text">
			<br>
			<input type="checkbox">
			<label for="">Driver's License</label>
			<br>
			Gender:
			<input type="radio" name="gender" value="m" id="male">
			<label for="male">Male</label>
			<input type="radio" name="gender" value="f" id="female">
			<label for="female">Female</label>
			<br>
			<label for="">Email</label>
			<input type="email">
		</fieldset>
		<br>
		<textarea name="" id="" rows="4" cols="28">TERMS AND CONDITIONS...</textarea>
		<br>
		<br>
		<input type="submit" value="Send Form">
		<input type="reset" value="Clear Form">
	</form>	
</body>
</html>
